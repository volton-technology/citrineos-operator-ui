name: Build

on:
  pull_request:

concurrency:
  # Rerun check when the PR is updated, https://stackoverflow.com/a/72408109
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    # Fork PRs must not run on our self-hosted ARC runners (privileged, production nodes).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: volton-arc-production # todo: to prevent needing to run npm i we can have our own image where everything is installed
    strategy:
      matrix:
        node-version: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Build
        run: docker buildx build --file Dockerfile .
